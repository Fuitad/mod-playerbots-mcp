[project]
name = "playerbot-mcp"
version = "0.1.0"
description = "Typed client and MCP surface for the mod-playerbots verification server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0,<3",
    "pydantic>=2.9.0",
]

[project.scripts]
playerbot-mcp = "playerbot_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playerbot_mcp"]

[dependency-groups]
dev = [
    "basedpyright>=1.21.0",
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: model and framing tests that never open a socket",
    "integration: tests against a test owned fake loopback endpoint",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
