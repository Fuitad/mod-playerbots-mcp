name: Quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake cppcheck g++ ninja-build clang-format-18

      - name: Install actionlint
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" \
            | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install /tmp/actionlint /usr/local/bin/actionlint

      - name: Check repository contracts
        run: |
          python3 -m unittest tests/python/test_check_repository.py
          python3 tools/check_repository.py

      - name: Configure standalone tests
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build standalone tests
        run: cmake --build build --parallel 8

      - name: Run standalone tests
        run: ctest --test-dir build --output-on-failure

      - name: Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install locked sidecar environment
        working-directory: sidecar
        run: uv sync --locked --dev

      - name: Check sidecar formatting
        working-directory: sidecar
        run: uv run ruff format --check .

      - name: Lint sidecar
        working-directory: sidecar
        run: uv run ruff check .

      - name: Type check sidecar
        working-directory: sidecar
        run: uv run basedpyright src tests

      - name: Test sidecar offline
        working-directory: sidecar
        run: uv run pytest -q

      - name: Check C++ formatting
        run: git ls-files -z '*.cpp' '*.h' | xargs -0 clang-format-18 --dry-run --Werror

      - name: Check C++ quality
        run: >-
          cppcheck --enable=warning,style,performance,portability
          --error-exitcode=1 --inline-suppr --suppressions-list=.suppress.cppcheck
          --suppress=missingInclude
          --suppress=missingIncludeSystem --std=c++20 src tests/cpp

      - name: Check workflows
        run: actionlint
